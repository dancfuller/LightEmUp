<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0f1e">
  <title>LightEmUp Express</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/express-icon.png">
  <link rel="apple-touch-icon" href="/express-icon.png">
  <!--
    LightEmUp Express (v3.63.0): big buttons for a phone's home screen. Deliberately
    plain HTML with no React/Babel/CDN — the point is to beat "open the app, scroll to
    the room" to the light switch. Opening the page changes nothing; pressing a button
    POSTs /api/express/press. The buttons are set up in Settings → LightEmUp Express.
    See backend/CLAUDE.md "LightEmUp Express".
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0f1e; color: #e2e8f0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 16px 32px;
    }
    main { max-width: 760px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    h1 { font-size: 18px; font-weight: 700; color: #94a3b8; letter-spacing: 0.3px; }
    h1 b { color: #e2e8f0; }
    header a { color: #64748b; font-size: 13px; text-decoration: none; padding: 6px 2px; }
    #buttons { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 600px) { #buttons { grid-template-columns: 1fr 1fr; } }
    .pill {
      display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px;
      padding: 12px 22px; border-radius: 999px; cursor: pointer; text-align: left;
      font: inherit; font-size: 18px; font-weight: 700; color: #e2e8f0;
      border: 2px solid #334155; background: #1e293b;
      -webkit-tap-highlight-color: transparent; transition: transform 0.08s, border-color 0.2s;
    }
    .pill:active { transform: scale(0.97); }
    .pill .dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; }
    .pill .label { flex: 1; line-height: 1.25; }
    .pill .state { width: 26px; text-align: center; font-size: 20px; flex-shrink: 0; }
    .pill.off { background: #111827; color: #cbd5e1; }
    .pill.off .dot { border: 3px solid #475569; }
    .pill.on { background: rgba(99,102,241,0.18); border-color: rgba(129,140,248,0.5); }
    .pill.busy { opacity: 0.7; }
    .pill.busy .state { animation: spin 0.9s linear infinite; }
    .pill.ok { border-color: #22c55e; }
    .pill.ok .state { color: #22c55e; }
    .pill.fail { border-color: #ef4444; }
    .pill.fail .state { color: #ef4444; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #msg { margin-top: 16px; font-size: 15px; line-height: 1.5; color: #94a3b8; text-align: center; min-height: 22px; }
    #msg.fail { color: #fca5a5; }
    #retry { display: block; margin: 16px auto 0; padding: 12px 24px; border-radius: 999px;
      border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font: inherit; font-weight: 600; }
    [hidden] { display: none !important; }
    /* Ask (v3.67.0): the same /api/ask as the app's Ask bar, in plain JS. */
    #ask { margin-bottom: 18px; }
    #ask form { display: flex; gap: 10px; }
    #ask input {
      flex: 1 1 auto; min-width: 0; min-height: 56px; padding: 12px 20px;
      border-radius: 999px; border: 2px solid #475569; background: #0f172a; color: #f1f5f9;
      font: inherit; font-size: 17px; outline: none;   /* 16px+ or iOS zooms on focus */
    }
    #ask input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.25); }
    #ask input:disabled { color: #94a3b8; }
    #go {
      flex: 0 0 auto; min-width: 76px; min-height: 56px; padding: 0 20px; border-radius: 999px;
      font: inherit; font-size: 17px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 2px solid #334155; background: transparent; color: #64748b;
      -webkit-tap-highlight-color: transparent;
    }
    #go.ready { border-color: #4f46e5; background: #4f46e5; color: #fff; }
    #go.busy { border-color: #4f46e5; background: rgba(79,70,229,0.15); color: #c7d2fe; }
    #go .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(199,210,254,0.35);
      border-top-color: #c7d2fe; animation: spin 0.8s linear infinite; }
    #reply { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
      margin: 10px 6px 0; font-size: 15px; line-height: 1.45; }
    #reply .text.done { color: #86efac; }
    #reply .text.ask { color: #fcd34d; }
    #reply .text.error { color: #fca5a5; }
    #reply .text.info { color: #cbd5e1; }
    #reply .text.busy { color: #c7d2fe; animation: pulse 1.6s ease-in-out infinite; }
    #reply .said { color: #64748b; }
    #reply button { padding: 8px 20px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 700;
      border: 1px solid #475569; background: transparent; color: #cbd5e1; cursor: pointer; }
    #reply button.yes { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    @keyframes pulse { 50% { opacity: 0.55; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1><b>LightEmUp</b> Express</h1>
    <a href="/">Open the app ›</a>
  </header>
  <!-- Hidden if /api/ask/status says no key is saved. Shown from the start, so the
       buttons below never jump down under a thumb. No mic button: the phone
       keyboard's own dictation mic works here, and an in-page mic needs https. -->
  <section id="ask">
    <form>
      <input id="say" placeholder="💬 Tap to type or speak" enterkeyhint="send"
             autocomplete="off" autocapitalize="sentences" aria-label="Tell LightEmUp what to do">
      <button id="go" type="submit">Go</button>
    </form>
    <div id="reply" role="status" hidden></div>
  </section>
  <div id="buttons"></div>
  <div id="msg">Loading…</div>
  <button id="retry" hidden>Try again</button>
</main>
<script>
(function () {
  var box = document.getElementById("buttons"), msg = document.getElementById("msg"),
      retry = document.getElementById("retry");

  // Kelvin → a display color for the dot, same idea as the app's kelvinToRGB.
  function kelvinCss(k) {
    var t = k / 100, r, g, b;
    r = t <= 66 ? 255 : 329.7 * Math.pow(t - 60, -0.1332);
    g = t <= 66 ? 99.47 * Math.log(t) - 161.12 : 288.12 * Math.pow(t - 60, -0.0755);
    b = t >= 66 ? 255 : t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04;
    var c = function (v) { return Math.round(Math.max(0, Math.min(255, v))); };
    return "rgb(" + c(r) + "," + c(g) + "," + c(b) + ")";
  }

  function say(text, fail) { msg.textContent = text || ""; msg.className = fail ? "fail" : ""; }

  function render(buttons) {
    box.innerHTML = "";
    if (!buttons.length) {
      say("No buttons yet. Add them in the app under Settings → LightEmUp Express.");
      return;
    }
    say("");
    buttons.forEach(function (b) {
      var a = b.action || {};
      var el = document.createElement("button");
      el.className = "pill " + (a.type === "power" && !a.on ? "off" : a.type === "power" ? "on" : "white");
      var dot = document.createElement("span"); dot.className = "dot";
      if (a.type === "white") {
        var col = kelvinCss(a.kelvin || 2700);
        dot.style.background = col;
        dot.style.boxShadow = "0 0 14px " + col;
        el.style.borderColor = col.replace("rgb", "rgba").replace(")", ",0.45)");
      } else if (a.on) {
        dot.style.background = "#818cf8";
      }
      var label = document.createElement("span"); label.className = "label"; label.textContent = b.label;
      var state = document.createElement("span"); state.className = "state";
      el.appendChild(dot); el.appendChild(label); el.appendChild(state);
      el.onclick = function () { press(b, el, state); };
      box.appendChild(el);
    });
  }

  function press(b, el, state) {
    if (el.classList.contains("busy")) return;     // a second tap while one is in flight
    el.classList.remove("ok", "fail"); el.classList.add("busy");
    state.textContent = "◌"; say("");
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 15000);
    fetch("/api/express/press", {
      method: "POST", signal: ctl.signal,
      headers: { "Content-Type": "application/json", "X-Client-Id": "express" },
      body: JSON.stringify({ id: b.id }),
    }).then(function (res) {
      if (res.ok) return null;
      return res.json().then(function (j) { return j.detail || ("Error " + res.status); },
                            function () { return "Error " + res.status; });
    }).then(function (err) {
      clearTimeout(timer); el.classList.remove("busy");
      if (err) return failed(b, el, state, err);
      el.classList.add("ok"); state.textContent = "✓";
      setTimeout(function () { el.classList.remove("ok"); state.textContent = ""; }, 4000);
    }, function (e) {
      clearTimeout(timer); el.classList.remove("busy");
      failed(b, el, state, e && e.name === "AbortError"
        ? "LightEmUp didn't answer within 15 seconds."
        : "Couldn't reach LightEmUp. Is this phone on the home network?");
    });
  }
  function failed(b, el, state, why) {
    // Never look like success when nothing happened.
    el.classList.add("fail"); state.textContent = "!";
    say("“" + b.label + "” didn't work: " + why, true);
  }

  function load() {
    retry.hidden = true; say("Loading…");
    fetch("/api/express").then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (j) { render(j.buttons || []); }, function () {
      say("Couldn't reach LightEmUp. Is this phone on the home network?", true);
      retry.hidden = false;
    });
  }
  retry.onclick = load;
  load();

  // ── Ask ────────────────────────────────────────────────────────────────
  // One id per page load keys Ask's few minutes of memory, so "yes" answers this
  // phone's question and not another one's.
  var askId = "express-" + Math.random().toString(36).slice(2, 10);
  var askBox = document.getElementById("ask"), form = askBox.querySelector("form"),
      input = document.getElementById("say"), go = document.getElementById("go"),
      reply = document.getElementById("reply"), busy = false, slowTimer = null;

  function paintGo() {
    go.className = busy ? "busy" : input.value.trim() ? "ready" : "";
    go.innerHTML = busy ? '<span class="spin"></span>Working' : "Go";
  }
  function showReply(text, tone, said, awaiting) {
    reply.innerHTML = ""; reply.hidden = false;
    var t = document.createElement("span"); t.className = "text " + tone; t.textContent = text;
    reply.appendChild(t);
    if (said) {
      var s = document.createElement("span"); s.className = "said"; s.textContent = "“" + said + "”";
      t.appendChild(document.createTextNode(" ")); t.appendChild(s);
    }
    if (awaiting) ["Yes", "No"].forEach(function (w) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = w;
      if (w === "Yes") b.className = "yes";
      b.onclick = function () { send(w.toLowerCase()); };
      reply.appendChild(b);
    });
  }

  function send(words) {
    var said = (words || input.value).trim();
    if (!said || busy) return;
    busy = true; input.disabled = true; paintGo();
    input.blur();   // close the phone keyboard so the progress line shows
    showReply("Working on it…", "busy", said);
    slowTimer = setTimeout(function () { showReply("Still working — setting the lights…", "busy", said); }, 6000);
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 90000);
    fetch("/api/ask", {
      method: "POST", signal: ctl.signal,
      headers: { "Content-Type": "application/json", "X-Client-Id": askId },
      body: JSON.stringify({ text: said }),
    }).then(function (res) {
      return res.json().then(function (j) {
        if (!res.ok) throw new Error(j.detail || ("Error " + res.status));
        return j;
      });
    }).then(function (r) {
      input.value = "";
      showReply(r.reply || "Done.", r.error ? "error" : r.awaiting ? "ask"
                : (r.actions || []).length ? "done" : "info", "", !!r.awaiting);
    }, function (e) {
      showReply(e && e.name === "AbortError" ? "LightEmUp didn't answer within 90 seconds."
                : e && e.message && !/fetch|network/i.test(e.message) ? e.message
                : "Couldn't reach LightEmUp. Is this phone on the home network?", "error");
    }).then(function () {
      clearTimeout(timer); clearTimeout(slowTimer);
      busy = false; input.disabled = false; paintGo();
    });
  }

  form.onsubmit = function (e) { e.preventDefault(); send(); };
  // A grey Go pressed before typing puts the cursor in the box (and opens the
  // keyboard) instead of doing nothing — same as the app.
  go.onclick = function (e) { if (!busy && !input.value.trim()) { e.preventDefault(); input.focus(); } };
  input.oninput = paintGo;

  fetch("/api/ask/status").then(function (r) { return r.ok ? r.json() : null; })
    .then(function (s) { if (s && !s.enabled) askBox.hidden = true; }, function () {});
})();
</script>
</body>
</html>
